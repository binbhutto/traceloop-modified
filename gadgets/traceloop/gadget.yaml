name: traceloop
description: syscalls flight recorder
homepageURL: https://inspektor-gadget.io/
documentationURL: https://www.inspektor-gadget.io/docs/latest/gadgets/traceloop
sourceURL: https://github.com/inspektor-gadget/inspektor-gadget/tree/main/gadgets/traceloop
annotations:
  enable-containers-datasource: true
datasources:
  traceloop:
    annotations:
      description: Syscalls
    fields:
      mntns_id:
        annotations:
          template: mntns_id
      cpu:
        annotations:
          description: CPU number where the syscall was executed
          columns.maxwidth: 4
          columns.hidden: true
      pid:
        annotations:
          template: pid
      comm:
        annotations:
          template: comm
      syscall:
        annotations:
          template: syscall
      parameters:
        annotations:
          description: Syscall's parameters
          columns.width: 64
      ret:
        annotations:
          description: Syscall's return value
          columns.width: 10
          columns.alignment: right
params:
  wasm:
    syscall-filters:
      key: syscall-filters
      defaultValue: ""
      description: "Filter out by syscall names. Join multiple names with ','"
      title: Syscallfilters
    perf-buffer-pages:
      key: perf-buffer-pages
      defaultValue: "1024"
      description: "Size (in 4KiB pages) of the per-CPU, per-container overwritable ring buffer used to record syscalls. Memory usage scales as pages * 4096 * numCPUs * numContainers, so raise with care."
      title: Perf buffer pages
    memory-limit-pages:
      key: memory-limit-pages
      defaultValue: "16384"
      description: "Size (in 64KiB pages) of the wasm guest's linear memory (heap), used while decoding/formatting buffered syscalls at gadgetStop. Raise if you increase perf-buffer-pages and see wasm OOM/'unreachable' traps."
      title: Memory limit pages
